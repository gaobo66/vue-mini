<body>
    <script type="module">
    //   import {

    //   } from '../../../node_modules/vue/dist/vue.esm-browser.prod.js'
      import { ref, reactive,watch,effect } from '../dist/reactivity.esm.js'

     
    const array = reactive(['a', 'b', 'c', 'd'])

    /**
     * 一开始：['a', 'b', 'c', 'd'] length = 4
     * 更新后：['a', 'b'] length = 2
     */
    effect(() => {
        console.count('effect 执行了1')

        console.log(array)
    })

    setTimeout(() => {
    // array.length = 2 // 一秒钟成功打印 2
    array.push('e')
    console.log(array)
    }, 1000)

     
    </script>
</body>
