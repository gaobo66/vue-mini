<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
      body {
        padding: 150px;
      }
    </style>
  </head>
  <body>
  <div id="app"></div>
  <script type="module">
    // import { reactive, effect,readonly,isReadonly } from '../../../node_modules/vue/dist/vue.esm-browser.js'
    import { reactive, effect,readonly,isReadonly  } from '../dist/reactivity.esm.js'

    const obj = {}
     const state = reactive({
      a: 1,
      b: {
        c: 1
      }
    })

    const readonlyState = readonly(state)

    effect(() => {
      console.log(readonlyState.a)
    })

    setTimeout(() => {
      state.a++ // 修改原始的 reactive 对象
      // readonlyState.a++ // 尝试修改 readonly 对象
    }, 1000)

    console.log('isReadonly',isReadonly(readonlyState))

  </script>
</body>

</html>
