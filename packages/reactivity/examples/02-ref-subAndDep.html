<html lang="en">

    #btn{
       
        margin:200px;

</style>
<body>
    <button id="btn">按钮</button>
    <script type="module">
    //   import {
    //     ref,
    //     effect,
    //   } from '../../../node_modules/vue/dist/vue.esm-browser.prod.js'
      import { ref, effect } from '../dist/reactivity.esm.js'

      const flag = ref(true)
      const count = ref(0)
      const e = effect(() => {
        flag.value
        count.value
        console.count('effect')
      })

      console.dir(e)
      btn.onclick = () => {
        count.value++
      }
    </script>
