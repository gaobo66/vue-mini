<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
      body {
        padding: 150px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
    //   import {
    //     reactive,
    //     effect,
    //     ref,
    //   } from '../../../node_modules/vue/dist/vue.esm-browser.prod.js'
    import { reactive, effect, ref } from '../dist/reactivity.esm.js'

    let count = ref(0)
    const state = reactive({
        a: count,
    }) 
   const e1 =  effect(() => {
        console.count('effect run1')
        console.log('state', state.a)
        console.log('count', count.value)
    })
    setTimeout(() => {
        state.a = ref(10)
        // count.value++
    }, 1000)


    const obj = reactive({
       a: {
        b: 2,
        c:{ d: 4 }
       }
    })

    const e2 =  effect(() => {
        console.count('effect run2')
        console.log('obj.a.c.d', obj.a.c.d)
        
    })
     setTimeout(() => {
        obj.a.c.d=20

    }, 1000)
    </script>
  </body>
</html>
