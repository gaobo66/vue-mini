<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script type="module">

        import {
            ref, effect, isRef,isReactive
        } from '../../../node_modules/vue/dist/vue.esm-browser.prod.js'

        // import { ref, effect, isRef,isReactive } from "../dist/reactivity.esm.js"

        const count = ref(0)


    /* 
    * 保存上一个 activeSub 的值，防止嵌套 effect 时丢失
    * 例如：
    * effect(() => {
    *   console.log(count.value, 'effect1')
    *   effect(() => {
    *     console.log(count.value, 'effect2')
    *   })
    * })
    * 
    *不保存上一个activeSub，输出：
    * 0 effect1
    * 0 effect2
    * 1 effect2
    */
        // effect1
        // effect(() => {
        // // 🚨 effect2 在 effect1 中执行
        // effect(() => {
        //     console.log('effect2', count.value)
        // })
        // console.log('effect1', count.value)
        // })

        // setTimeout(() => {
        // count.value = 1
        // }, 1000)


        // scheduler 示例
        effect(
        () => {
            console.log('在 fn 中收集了依赖', count.value)
        },
        {
            scheduler() {
            console.log('scheduler', count.value)
            }
        }
        )

        setTimeout(() => {
        // ⭐️ 由于传递了 scheduler ，所以我们更新响应式属性的时候，会触发 scheduler
        count.value++ // scheduler
        }, 1000)
        
        
        const state= ref({ a: 1, b: 2 })

        effect(() => {
            console.log('state', state.value.a)
            console.log('isRef state', isRef(state))
            console.log('isReactive state', isReactive(state))
        })
        setTimeout(() => {
            state.value.a = 10
        }, 1000)


    </script>

</body>

</html>
