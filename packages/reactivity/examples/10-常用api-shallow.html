  <body>
  <div id="app"></div>
  <script type="module">
    // import { shallowRef, effect,shallowReactive,isReactive } from '../../../node_modules/vue/dist/vue.esm-browser.js'
    import { reactive, effect, ref,shallowRef,shallowReactive,isReactive } from '../dist/reactivity.esm.js'

    // const c = ref({
    //     count: 1
    // });

    // effect(() => {
    //   console.log(c.value.count)
    // })

    // setTimeout(() => {
    //   c.value.count++ // 这一行不会触发 effect
    //   console.log(c)
    // }, 1000)


    const state = shallowReactive({
      a: 1,
      b: {
        c: 1
      }
    })

    effect(() => {
      // console.log(state.b.c)
      console.log(state.a)
    })

    setTimeout(() => {
      state.b.c++ // 这一行不会触发 effect
      state.a++ 
    }, 1000)
    console.log(isReactive(state))


  </script>
</body>

</html>
